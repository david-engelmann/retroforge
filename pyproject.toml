[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retroforge"
version = "0.1.0"
description = "Retrospectives that end in a pull request, every hunk citing its evidence"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
retroforge = "retroforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
